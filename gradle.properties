org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official


# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Allow libraries compiled against newer SDKs / AGP
android.dependency.enforceMinimumAgpVersion=false
android.suppressUnsupportedCompileSdk=37
kotlin.jvm.target.validation.mode=warning
